# Host nginx config for a "native" EC2 deployment (no containers):
#   - React build served from /var/www/meditrust
#   - /api/* proxied to gunicorn on 127.0.0.1:8000
# Install:  sudo cp deploy/nginx/meditrust.conf /etc/nginx/sites-available/meditrust
#           sudo ln -sf /etc/nginx/sites-available/meditrust /etc/nginx/sites-enabled/meditrust
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d meditrust.ddns.net
server {
    listen 80;
    server_name meditrust.ddns.net;

    root /var/www/meditrust;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Prometheus / uptime probes can hit the API health endpoint through nginx.
    location = /api/health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
        access_log off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
