name: Deploy

# Continuous delivery to AWS:
#   1. run the test suite
#   2. build and push backend/frontend images to GitHub Container Registry
#   3. (optional) publish the trained model artifacts to S3
#   4. SSH to the EC2 host and run deploy/deploy.sh, then verify /health/ready
#
# Required repository secrets:
#   EC2_HOST, EC2_USER, EC2_SSH_KEY            SSH access to the EC2 instance
# Optional secrets:
#   EC2_APP_DIR                                 checkout on the host (default /opt/meditrust)
#   DEPLOY_MODE                                 docker (default) or native
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,   for the S3 model publish step
#   AWS_REGION, MODEL_S3_BUCKET
#   PUBLIC_URL                                  e.g. http://meditrust.ddns.net (post-deploy check)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/meditrust

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            ml/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - run: ruff check backend ml
      - run: pytest backend/tests ml/tests -p no:cacheprovider
        env:
          JWT_SECRET: ci-secret
          ADMIN_PASSWORD: CiAdmin@2026

  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ env.IMAGE_REPO }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-model:
    name: Publish model artifacts to S3
    runs-on: ubuntu-latest
    needs: test
    env:
      MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: env.MODEL_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Upload versioned + latest artifacts
        if: env.MODEL_S3_BUCKET != ''
        run: |
          VERSION=$(python -c "import json;print(json.load(open('ml/models/model_metadata.json'))['model_version'])")
          aws s3 sync ml/models "s3://$MODEL_S3_BUCKET/models/$VERSION" --exclude "*.png"
          aws s3 sync ml/models "s3://$MODEL_S3_BUCKET/models/latest" --delete --exclude "*.png"
          echo "Published model $VERSION to s3://$MODEL_S3_BUCKET/models/latest"
      - name: Skipped
        if: env.MODEL_S3_BUCKET == ''
        run: echo "MODEL_S3_BUCKET secret not set; skipping S3 publish."

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, publish-model]
    environment:
      name: production
      url: ${{ secrets.PUBLIC_URL || 'http://meditrust.ddns.net' }}
    steps:
      - name: Run deploy script on the host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_REPO,DEPLOY_MODE,APP_DIR
          script: |
            set -e
            cd "${APP_DIR:-/opt/meditrust}"
            git fetch origin main && git checkout main && git reset --hard origin/main
            IMAGE_TAG="$IMAGE_TAG" IMAGE_REPO="$IMAGE_REPO" DEPLOY_MODE="$DEPLOY_MODE" APP_DIR="${APP_DIR:-/opt/meditrust}" ./deploy/deploy.sh
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/meditrust
          DEPLOY_MODE: ${{ secrets.DEPLOY_MODE }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
      - name: Post-deploy smoke check
        if: ${{ secrets.PUBLIC_URL != '' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.PUBLIC_URL }}/api/health/ready"; then echo; echo "ready"; exit 0; fi
            sleep 10
          done
          echo "service did not become ready"; exit 1
