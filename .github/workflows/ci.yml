name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check backend ml
          ruff format --check backend ml
      - name: Unit + API tests
        env:
          JWT_SECRET: ci-secret
          ADMIN_PASSWORD: CiAdmin@2026
        run: pytest backend/tests ml/tests -p no:cacheprovider --cov=backend/app --cov=ml/src --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  ml-pipeline:
    name: ML pipeline reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Preprocess + train (LogReg / RandomForest / XGBoost benchmark)
        run: |
          python ml/src/preprocess.py
          python ml/src/train_models.py
      - name: Check model card quality gates
        run: |
          python - <<'PY'
          import json
          card = json.load(open("ml/models/model_metadata.json"))
          auc = card["cross_validation"]["roc_auc_mean"]
          thr = card["thresholds"]
          print("CV ROC-AUC", auc, "thresholds", thr["rule_out"], thr["rule_in"])
          assert auc >= 0.85, f"CV ROC-AUC regressed to {auc}"
          assert 0 < thr["rule_out"] < thr["rule_in"] < 1
          assert thr["rule_out_metrics"]["sensitivity"] >= 0.9
          assert card["label_definition"].startswith("1 = angiographic coronary artery disease")
          PY
      - name: Upload model card + reports
        uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: |
            ml/models/model_metadata.json
            ml/models/model_results.csv
            ml/reports/*.png

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: /api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: meditrust-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: meditrust-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
